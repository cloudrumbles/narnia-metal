name: apple

on:
  push:
    branches: [main, ios]
    paths:
      - 'ios/**'
      - 'host/**'
      - 'vkr/**'
      - 'common/**'
      - 'virglrenderer/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:
    inputs:
      live_minutes:
        description: 'Live test: minutes the macOS host stays connected to the relay in the NM_LIVE_RELAY secret (host:port:token); 0 = off'
        required: false
        default: '0'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        run: ios/fetch-deps.sh

      - name: Build iPad app
        run: BUILD=${{ github.run_number }} ios/build.sh ios

      - name: Build macOS host
        run: ios/build.sh macos

      - uses: actions/upload-artifact@v4
        with:
          name: NarniaMetal-ipa
          path: ios/out/NarniaMetal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: nm-host-macos
          path: ios/out/nm-host-macos

      - name: Metal device info
        run: system_profiler SPDisplaysDataType | head -20

      - name: Live test against a box relay
        if: ${{ github.event.inputs.live_minutes != '' && github.event.inputs.live_minutes != '0' }}
        env:
          RELAY: ${{ secrets.NM_LIVE_RELAY }}
          MINUTES: ${{ github.event.inputs.live_minutes }}
        run: |
          mkdir -p frames
          # no coreutils timeout on macOS runners
          NM_DUMP_DIR=$PWD/frames NM_DUMP_EVERY=60 ios/out/nm-host-macos "relay:$RELAY" > live.log 2>&1 &
          pid=$!
          sleep $(( MINUTES * 60 ))
          kill $pid || true
          cat live.log

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.live_minutes != '' && github.event.inputs.live_minutes != '0' }}
        with:
          name: live-test
          path: |
            frames
            live.log
