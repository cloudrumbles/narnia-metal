name: apple

on:
  push:
    branches: [main, ios]
    paths:
      - 'ios/**'
      - 'host/**'
      - 'vkr/**'
      - 'common/**'
      - 'virglrenderer/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:
    inputs:
      live_minutes:
        description: 'Live test: minutes the macOS host stays connected to the relay in the NM_LIVE_RELAY secret (host:port:token); 0 = off'
        required: false
        default: '0'
      driver:
        description: "Host Vulkan driver: kosmickrisp or moltenvk"
        required: false
        default: kosmickrisp

permissions:
  contents: write

jobs:
  build:
    # KosmicKrisp needs Metal 4: macOS 26 runtime + Xcode 26 SDKs
    runs-on: ${{ github.event.inputs.driver == 'moltenvk' && 'macos-15' || 'macos-26' }}
    env:
      # KosmicKrisp is the default (pushes to main publish it); MoltenVK only on request
      NM_DRIVER: ${{ github.event.inputs.driver || 'kosmickrisp' }}
      VERSION: 0.1.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        run: ios/fetch-deps.sh

      - name: Metal 4 on this runner?
        if: ${{ env.NM_DRIVER == 'kosmickrisp' }}
        run: |
          sw_vers; xcodebuild -version
          cat > /tmp/m.m <<'EOT'
          #import <Metal/Metal.h>
          int main(void) {
            id<MTLDevice> d = MTLCreateSystemDefaultDevice();
            NSLog(@"device %@ family Apple7 %d Metal4-queue %d", d.name,
                  [d supportsFamily:MTLGPUFamilyApple7],
                  [d respondsToSelector:@selector(newMTL4CommandQueue)]);
            if (@available(macOS 26.0, *)) NSLog(@"MTL4 queue %@", [d newMTL4CommandQueue]);
            return 0;
          }
          EOT
          clang -fobjc-arc -framework Metal -framework Foundation /tmp/m.m -o /tmp/m && /tmp/m || true

      - name: Cache KosmicKrisp
        if: ${{ env.NM_DRIVER == 'kosmickrisp' }}
        id: kk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/out/kk-macos
            ios/out/kk-ios
            ios/out/kk-tools
          key: kk-${{ hashFiles('kosmickrisp/**', 'ios/build-kk.sh') }}

      - name: Build KosmicKrisp
        if: ${{ env.NM_DRIVER == 'kosmickrisp' && steps.kk-cache.outputs.cache-hit != 'true' }}
        run: |
          ios/build-kk.sh tools
          ios/build-kk.sh ios

      - name: Save KosmicKrisp cache
        if: ${{ env.NM_DRIVER == 'kosmickrisp' && steps.kk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ios/out/kk-macos
            ios/out/kk-ios
            ios/out/kk-tools
          key: kk-${{ hashFiles('kosmickrisp/**', 'ios/build-kk.sh') }}

      - name: Build iPad app
        run: ios/build.sh ios

      - name: Build macOS host
        # the runner's paravirtual GPU has no Metal 4, so no KosmicKrisp host here
        if: ${{ env.NM_DRIVER != 'kosmickrisp' }}
        run: ios/build.sh macos

      - uses: actions/upload-artifact@v4
        with:
          name: NarniaMetal-ipa
          path: ios/out/NarniaMetal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: nm-host-macos
          path: |
            ios/out/nm-host-macos
            ios/out/libvulkan_kosmickrisp.dylib

      # Every main build becomes a release, and the SideStore source (a
      # fixed URL) points at it, so SideStore offers it as an update.
      - name: Publish release + SideStore source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API has bad minutes; retry each call with backoff
          retry() { for i in 1 2 3 4 5 6; do "$@" && return 0; sleep $((i * 10)); done; return 1; }
          tag=ipad-v$VERSION
          cp ios/out/NarniaMetal.ipa NarniaMetal-$VERSION.ipa
          gh release view "$tag" >/dev/null 2>&1 ||
            retry gh release create "$tag" --prerelease \
              --title "iPad app $VERSION" --target "$GITHUB_SHA" \
              --notes "Built from $GITHUB_SHA: $(git log -1 --format=%s)"
          retry gh release upload "$tag" NarniaMetal-$VERSION.ipa --clobber
          url="https://github.com/${{ github.repository }}/releases/download/$tag/NarniaMetal-$VERSION.ipa"
          NOTES="$(git log -1 --format=%s)" \
            python3 ios/make-source.py "$VERSION" "$BUILD" NarniaMetal-$VERSION.ipa "$url" source.json
          gh release view source >/dev/null 2>&1 ||
            retry gh release create source --prerelease --title "SideStore source" \
              --notes "Add https://github.com/${{ github.repository }}/releases/download/source/source.json as a source in SideStore."
          retry gh release upload source source.json --clobber

      - name: Metal device info
        run: system_profiler SPDisplaysDataType | head -20

      - name: Live test against a box relay
        if: ${{ github.event.inputs.live_minutes != '' && github.event.inputs.live_minutes != '0' }}
        env:
          # each driver has its own relay on the box, so tests don't collide
          RELAY: ${{ env.NM_DRIVER == 'kosmickrisp' && secrets.NM_LIVE_RELAY_KK || secrets.NM_LIVE_RELAY }}
          MINUTES: ${{ github.event.inputs.live_minutes }}
        run: |
          mkdir -p frames
          # no coreutils timeout on macOS runners
          NM_DUMP_DIR=$PWD/frames NM_DUMP_EVERY=60 MESA_KK_DEBUG= ios/out/nm-host-macos "relay:$RELAY" > live.log 2>&1 &
          pid=$!
          sleep $(( MINUTES * 60 ))
          kill $pid || true
          cat live.log

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.live_minutes != '' && github.event.inputs.live_minutes != '0' }}
        with:
          name: live-test
          path: |
            frames
            live.log
